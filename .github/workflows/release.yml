name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and package
        run: |
          ./scripts/package_release.sh

      - name: Get version info
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' TimeGo/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' TimeGo/Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "zip_name=TimeGo-${VERSION}-b${BUILD}.zip" >> $GITHUB_OUTPUT

      - name: Release latest (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TimeGo Latest"
          body: |
            Automated build from main branch.
            Version: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }})
            Commit: ${{ github.sha }}
          files: dist/*.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "TimeGo ${{ github.ref_name }}"
          body: |
            Release ${{ github.ref_name }}.
            Version: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }})
          files: dist/*.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
