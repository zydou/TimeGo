name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build and package
        run: |
          ./scripts/package_release.sh

      - name: Get version info
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' TimeGo/Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Release latest (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "TimeGo Latest"
          body: |
            Automated build from main branch.
            Version: ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}
          files: dist/*.zip
          prerelease: false
          make_latest: true
          overwrite_body: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "TimeGo ${{ github.ref_name }}"
          body: |
            Release ${{ github.ref_name }}.
            Version: ${{ steps.version.outputs.version }}
          files: dist/*.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
